<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidRide - Reset Password</title>
  <link rel="icon" type="image/png" href="rapidride_logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="layout-wrapper">
    <!-- Left side: Background image -->
    <div class="image-section"></div>
    
    <!-- Right side: Full teal panel with centered card -->
    <div class="teal-panel">
      <div class="form-container">
        <div class="logo-line">
          <img src="rapidride_logo.png" class="app-logo" alt="RapidRide Logo">
          <div class="title-text">
            <h1>RAPIDRIDE</h1>
            <p>Create new password</p>
          </div>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input id="password" type="password" placeholder="Enter new password">
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Re-enter new password">
        </div>

        <button class="btn-primary" onclick="resetPassword()">Reset Password</button>

        <div class="form-footer">
          <p>Remember your password? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5500';
    const email = sessionStorage.getItem('reset_email');
    const token = sessionStorage.getItem('reset_token');

    // Redirect if no token or email in session
    if (!email || !token) {
      window.location.href = 'forgot-password.html';
    }

    async function resetPassword() {
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!password || !confirmPassword) {
        alert('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword: password })
        });

        const data = await response.json();

        if (data.success) {
          alert('Password reset successful! Please login with your new password.');
          
          // Clear session storage
          sessionStorage.removeItem('reset_email');
          sessionStorage.removeItem('reset_token');

          // Redirect to login page
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Failed to reset password');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      }
    }
  </script>
</body>
</html>
