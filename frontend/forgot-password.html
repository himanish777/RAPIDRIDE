<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidRide - Forgot Password</title>
  <link rel="icon" type="image/png" href="rapidride_logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="layout-wrapper">
    <!-- Left side: Background image -->
    <div class="image-section"></div>
    
    <!-- Right side: Full teal panel with centered card -->
    <div class="teal-panel">
      <div class="form-container">
        <div class="logo-line">
          <img src="rapidride_logo.png" class="app-logo" alt="RapidRide Logo">
          <div class="title-text">
            <h1>RAPIDRIDE</h1>
            <p>Reset your password</p>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" placeholder="Enter your registered email">
        </div>

        <button class="btn-primary" onclick="sendOTP()">Send OTP</button>

        <div class="form-footer">
          <p>Remember your password? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5500';

    async function sendOTP() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        alert('Please enter your email');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          alert('OTP sent to your email!');
          // Store email in session and redirect
          sessionStorage.setItem('reset_email', email);
          window.location.href = 'verify-otp.html';
        } else {
          alert(data.message || 'Failed to send OTP');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      }
    }
  </script>
</body>
</html>
