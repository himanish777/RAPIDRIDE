<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidRide - Login</title>
  <link rel="icon" type="image/png" href="rapidride_logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="layout-wrapper">
    <!-- Left side: Background image -->
    <div class="image-section"></div>
    
    <!-- Right side: Full teal panel with centered card -->
    <div class="teal-panel">
      <div class="form-container">
        <div class="logo-line">
          <img src="rapidride_logo.png" class="app-logo" alt="RapidRide Logo">
          <div class="title-text">
            <h1>RAPIDRIDE</h1>
            <p>Login to continue</p>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password">
          <div style="text-align: right; margin-top: 8px;">
            <a href="forgot-password.html" style="color: #0D9488; font-size: 13px; text-decoration: none; font-weight: 500;">Forgot Password?</a>
          </div>
        </div>

        <button class="btn-primary" onclick="login()">Login</button>

        <div class="form-footer">
          <p>Don't have an account? <a href="signup.html">Signup</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
