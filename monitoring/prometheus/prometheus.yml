global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # RapidRide API metrics
  - job_name: 'rapidride-api'
    static_configs:
      - targets: ['host.docker.internal:5500']
    scrape_interval: 5s
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
