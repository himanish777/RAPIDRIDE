<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Ride - RapidRide</title>
  <link rel="icon" type="image/png" href="../../rapidride_logo.png">
  <link rel="stylesheet" href="../assets/css/book-ride.css">
  
  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <button class="back-btn" id="backBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1 class="header-title">Book Your Ride</h1>
    <div style="width: 40px;"></div>
  </header>

  <div class="container">
    <!-- MAP SECTION -->
    <div class="map-section">
      <div id="map" class="map"></div>
      <button class="my-location-btn" id="myLocationBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <!-- BOOKING FORM -->
    <div class="booking-panel">
      <!-- LOCATION INPUTS -->
      <div class="location-inputs">
        <button class="use-current-location-btn" id="useCurrentLocationBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Use Current Location
        </button>
        <div class="input-group">
          <div class="input-icon pickup-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <input type="text" id="pickupInput" class="location-input" placeholder="Pickup location" autocomplete="off">
        </div>
        <div class="input-connector"></div>
        <div class="input-group">
          <div class="input-icon drop-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <input type="text" id="dropInput" class="location-input" placeholder="Drop location" autocomplete="off">
        </div>
        
        <!-- AUTOCOMPLETE DROPDOWNS -->
        <div class="autocomplete-dropdown" id="pickupDropdown"></div>
        <div class="autocomplete-dropdown" id="dropDropdown"></div>
      </div>

      <!-- RIDE OPTIONS -->
      <div class="ride-options" id="rideOptions">
        <h3 class="section-title">Choose Your Ride</h3>
        
        <div class="ride-card" data-type="economy">
          <div class="ride-card-left">
            <div class="car-icon">🚗</div>
            <div class="ride-info">
              <h4 class="ride-name">Economy</h4>
              <p class="ride-desc">Affordable everyday rides</p>
              <p class="ride-capacity">👤 4 seats</p>
            </div>
          </div>
          <div class="ride-card-right">
            <div class="ride-time">5 min</div>
            <div class="ride-price">₹<span class="price-value">--</span></div>
          </div>
        </div>

        <div class="ride-card" data-type="comfort">
          <div class="ride-card-left">
            <div class="car-icon">🚙</div>
            <div class="ride-info">
              <h4 class="ride-name">Comfort</h4>
              <p class="ride-desc">More spacious with AC</p>
              <p class="ride-capacity">👤 4 seats</p>
            </div>
          </div>
          <div class="ride-card-right">
            <div class="ride-time">7 min</div>
            <div class="ride-price">₹<span class="price-value">--</span></div>
          </div>
        </div>

        <div class="ride-card" data-type="premium">
          <div class="ride-card-left">
            <div class="car-icon">🚘</div>
            <div class="ride-info">
              <h4 class="ride-name">Premium</h4>
              <p class="ride-desc">Luxury sedans & SUVs</p>
              <p class="ride-capacity">👤 4 seats</p>
            </div>
          </div>
          <div class="ride-card-right">
            <div class="ride-time">10 min</div>
            <div class="ride-price">₹<span class="price-value">--</span></div>
          </div>
        </div>

        <div class="ride-card" data-type="shared">
          <div class="ride-card-left">
            <div class="car-icon">🚐</div>
            <div class="ride-info">
              <h4 class="ride-name">Shared</h4>
              <p class="ride-desc">Share ride, save money</p>
              <p class="ride-capacity">👥 Shared ride</p>
            </div>
          </div>
          <div class="ride-card-right">
            <div class="ride-time">15 min</div>
            <div class="ride-price">₹<span class="price-value">--</span></div>
          </div>
        </div>
      </div>

      <!-- CONFIRM BUTTON -->
      <button class="confirm-btn" id="confirmRideBtn" disabled>
        <span class="btn-text">Select Locations</span>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script type="module" src="../assets/js/book-ride.js"></script>
</body>
</html>
